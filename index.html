<!DOCTYPE html>
<html>
<head>
  <title>Advanced Calculator Pro+</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body id="body" class="bg-gradient-to-r from-gray-900 to-gray-800 flex items-center justify-center h-screen transition">

<div class="flex gap-4 flex-wrap justify-center">

  <!-- Calculator -->
  <div id="calcBox" class="backdrop-blur-lg bg-white/10 p-6 rounded-xl shadow-2xl w-80 border border-white/20">
    
    <!-- Top -->
    <div class="flex justify-between mb-3">
      <h1 class="text-white font-bold">Calc Pro+</h1>
      <div class="flex gap-2">
        <button onclick="toggleSound()" id="soundBtn">🔊</button>
        <button onclick="toggleTheme()" id="themeBtn">🌙</button>
      </div>
    </div>

    <!-- Display -->
    <input id="display" type="text"
      class="w-full mb-1 p-3 text-right text-xl rounded bg-black/40 text-white outline-none"
      disabled />

    <p id="preview" class="text-right text-gray-300 text-sm mb-1"></p>
    <p id="time" class="text-right text-green-400 text-xs mb-2"></p>

    <!-- Buttons -->
    <div class="grid grid-cols-4 gap-3">

      <button onclick="clearDisplay()" class="btn bg-red-500">C</button>
      <button onclick="deleteLast()" class="btn bg-yellow-500">⌫</button>
      <button onclick="append('%')" class="btn">%</button>
      <button onclick="append('/')" class="btn bg-orange-500">/</button>

      <button onclick="sqrt()" class="btn bg-purple-500">√</button>
      <button onclick="square()" class="btn bg-purple-500">x²</button>
      <button onclick="copyResult()" class="btn bg-blue-500">📋</button>
      <button onclick="append('*')" class="btn bg-orange-500">*</button>

      <button onclick="append('7')" class="btn">7</button>
      <button onclick="append('8')" class="btn">8</button>
      <button onclick="append('9')" class="btn">9</button>
      <button onclick="append('-')" class="btn bg-orange-500">-</button>

      <button onclick="append('4')" class="btn">4</button>
      <button onclick="append('5')" class="btn">5</button>
      <button onclick="append('6')" class="btn">6</button>
      <button onclick="append('+')" class="btn bg-orange-500">+</button>

      <button onclick="append('1')" class="btn">1</button>
      <button onclick="append('2')" class="btn">2</button>
      <button onclick="append('3')" class="btn">3</button>
      <button onclick="calculate()" class="btn bg-green-500">=</button>

      <button onclick="append('0')" class="btn col-span-2">0</button>
      <button onclick="append('.')" class="btn">.</button>

      <button onclick="useAns()" class="btn bg-blue-500 col-span-4">Ans</button>
    </div>
  </div>

  <!-- History -->
  <div class="backdrop-blur-lg bg-white/10 p-4 rounded-xl w-56 text-white border border-white/20">
    <h2 class="font-bold mb-2">History</h2>

    <button onclick="clearHistory()" 
    class="bg-red-500 px-2 py-1 rounded text-xs mb-2">
      Clear
    </button>

    <ul id="history" class="text-sm space-y-1 max-h-72 overflow-y-auto"></ul>
  </div>

</div>

<script>
let display = document.getElementById("display");
let historyList = document.getElementById("history");
let lastResult = "";
let soundOn = true;

// Load history
window.onload = function () {
  let saved = JSON.parse(localStorage.getItem("history")) || [];
  saved.forEach(item => addHistory(item, false));
};

// Sound
function playSound() {
  if (!soundOn) return;
  new Audio("https://www.soundjay.com/buttons/button-16.mp3").play();
}

function toggleSound(){
  soundOn = !soundOn;
  document.getElementById("soundBtn").innerText = soundOn ? "🔊" : "🔇";
}

// Safe eval
function safeEval(exp){
  return Function('"use strict";return (' + exp + ')')();
}

// Operator check
function isOperator(char) {
  return "+-*/%".includes(char);
}

// Preview
function updatePreview() {
  try {
    if (display.value !== "") {
      document.getElementById("preview").innerText = "= " + safeEval(display.value);
    } else {
      document.getElementById("preview").innerText = "";
    }
  } catch {
    document.getElementById("preview").innerText = "";
  }
}

// Append
function append(value) {
  let lastChar = display.value.slice(-1);

  if (isOperator(value) && isOperator(lastChar)) return;
  if (display.value.length > 20) return;

  display.value += value;
  updatePreview();
  playSound();
}

// Clear
function clearDisplay() {
  display.value = "";
  updatePreview();
}

// Delete
function deleteLast() {
  display.value = display.value.slice(0, -1);
  updatePreview();
}

// Calculate
function calculate() {
  try {
    let start = performance.now();
    let result = safeEval(display.value);
    let end = performance.now();

    document.getElementById("time").innerText = "Time: " + (end-start).toFixed(2)+" ms";

    lastResult = result;

    let time = new Date().toLocaleTimeString();
    addHistory(display.value + " = " + result + " ("+time+")", true);

    display.value = result;
    updatePreview();
  } catch {
    display.value = "Error";
  }
}

// Scientific
function sqrt(){
  try{
    display.value = Math.sqrt(safeEval(display.value));
    updatePreview();
  }catch{}
}

function square(){
  try{
    display.value = Math.pow(safeEval(display.value),2);
    updatePreview();
  }catch{}
}

// Copy
function copyResult(){
  navigator.clipboard.writeText(display.value);
}

// Use Ans
function useAns() {
  display.value += lastResult;
  updatePreview();
}

// History
function addHistory(text, save = true) {
  let li = document.createElement("li");
  li.textContent = text;

  li.onclick = function () {
    display.value = text.split("=")[0].trim();
    updatePreview();
  };

  li.classList.add("cursor-pointer","hover:text-yellow-300");

  historyList.prepend(li);

  if (save) {
    let stored = JSON.parse(localStorage.getItem("history")) || [];
    stored.unshift(text);
    localStorage.setItem("history", JSON.stringify(stored.slice(0, 10)));
  }
}

function clearHistory() {
  historyList.innerHTML = "";
  localStorage.removeItem("history");
}

// Theme
let dark = true;
function toggleTheme() {
  let body = document.getElementById("body");
  dark = !dark;

  if (dark) {
    body.className = "bg-gradient-to-r from-gray-900 to-gray-800 flex items-center justify-center h-screen";
    document.getElementById("themeBtn").innerText = "🌙";
  } else {
    body.className = "bg-gradient-to-r from-blue-200 to-white flex items-center justify-center h-screen";
    document.getElementById("themeBtn").innerText = "☀️";
  }
}

// Keyboard
document.addEventListener("keydown", function(e) {
  if (!isNaN(e.key) || "+-*/.%".includes(e.key)) {
    append(e.key);
  } else if (e.key === "Enter") {
    e.preventDefault();
    calculate();
  } else if (e.key === "Backspace") {
    deleteLast();
  } else if (e.key === "Escape") {
    clearDisplay();
  }
});
</script>

<style>
.btn {
  background: #4b5563;
  color: white;
  padding: 12px;
  border-radius: 8px;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.05);
  background: #6b7280;
}

button:active {
  transform: scale(0.9);
}
</style>

</body>
</html>
